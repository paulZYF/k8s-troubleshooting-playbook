apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  labels: {app: report-worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: report-worker}
  template:
    metadata:
      labels: {app: report-worker}
    spec:
      containers:
        - name: worker
          image: polinux/stress:1.0.4
          # the job really needs ~150 MiB of memory
          command: ["sh", "-c", "echo 'loading report data'; sleep 2; exec stress --vm 1 --vm-bytes 150M --vm-hang 0 --vm-keep"]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 64Mi}
