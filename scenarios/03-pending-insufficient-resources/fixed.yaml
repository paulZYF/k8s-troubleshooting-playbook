apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  labels: {app: analytics}
spec:
  replicas: 1
  selector:
    matchLabels: {app: analytics}
  template:
    metadata:
      labels: {app: analytics}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            # sized from real usage (kubectl top pod) plus headroom
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
