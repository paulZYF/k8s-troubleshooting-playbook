apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  labels: {app: analytics}
spec:
  replicas: 1
  selector:
    matchLabels: {app: analytics}
  template:
    metadata:
      labels: {app: analytics}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            # copied from a big production node pool; no node in this cluster has this much
            requests: {cpu: "64", memory: 256Gi}
            limits: {memory: 256Gi}
