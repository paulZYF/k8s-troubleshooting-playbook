apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
spec:
  storageClassName: fast-ssd   # does not exist in this cluster
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uploader
  labels: {app: uploader}
spec:
  replicas: 1
  selector:
    matchLabels: {app: uploader}
  template:
    metadata:
      labels: {app: uploader}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo ok > /data/health; while true; do sleep 3600; done"]
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: uploads}
