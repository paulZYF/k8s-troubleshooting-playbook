apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels: {app: notifier}
spec:
  replicas: 1
  selector:
    matchLabels: {app: notifier}
  template:
    metadata:
      labels: {app: notifier}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo mode=$MODE; while true; do sleep 3600; done"]
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef: {name: notifier-config, key: mode}   # ConfigMap was never created
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef: {name: notifier-smtp, key: password}     # Secret was never created
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
