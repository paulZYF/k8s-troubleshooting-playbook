apiVersion: v1
kind: Secret
metadata:
  name: orders-db
type: Opaque
stringData:
  url: postgres://orders@orders-db:5432/orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels: {app: orders-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: required env var DATABASE_URL is not set" >&2
                exit 1
              fi
              echo "connecting to $DATABASE_URL"; while true; do sleep 3600; done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: orders-db, key: url}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
